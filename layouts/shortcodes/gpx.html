{{- /*
  Shows one or more GPX tracks on a Leaflet map.
  Usage: {{< gpx "track.gpx" >}} or {{< gpx "a.gpx" "b.gpx" >}}

  Only markup here: no <script> or <link> in the post content, so .Summary
  stays clean. CSS, the libraries and /gpx-shortcode/gpx.js are added by
  partials/gpx-scripts.html, which the site's footer includes on pages that
  use this shortcode. gpx.js builds a map for every section.gpx[data-tracks],
  plus the info list (distance, duration, elevation) in the footer, so there
  is no text here that could end up in the summary.
*/ -}}
{{- $tracks := slice -}}
{{- range .Params }}{{ $tracks = $tracks | append . }}{{ end -}}
<section id="container-{{ .Ordinal }}" class="gpx" data-tracks="{{ $tracks | jsonify }}">
  <div class="map" id="map-{{ .Ordinal }}"></div>
  <footer></footer>
</section>
